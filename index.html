.tr-folder[aria-expanded="true"] .tr-chev { transform: rotate(90deg); }
.tr-folder.sel { background: var(--sunk-2); }
.tr-cnt { font-size: var(--fs-1); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.tr-note { padding-left: calc(30px + var(--d) * 14px); }
.tr-note.is-open .tr-name { color: inherit; }
.tr-note.on { background: var(--surface); color: var(--fg); box-shadow: var(--sh1); }
.tr-note.on .tr-name { color: var(--fg); }
.tr-score { font-size: var(--fs-1); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.sdot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--fg-3); }
.sdot.st-idea { background: #A1A1AA; } .sdot.st-draft { background: #3B82F6; } .sdot.st-review { background: #F59E0B; } .sdot.st-done { background: #22C55E; } .sdot.st-published { background: #14B8A6; }
.tr-kids { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.tr-kids.grow-in > * { animation: tree-in var(--d2) var(--ease) both; }
@keyframes tree-in { from { opacity: 0; transform: translateY(-4px); } }
.tr.drop, .tr-root-drop.drop { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.tr-root-drop { min-height: 40px; border-radius: 7px; margin-top: 4px; }
.tr-search-head { padding: 2px 4px 6px; }
.nitem-snip mark { background: var(--hl); color: inherit; border-radius: 2px; }
@media (hover: hover) { .tr:hover { background: var(--hover); color: var(--fg); } .tr-note.on:hover { background: var(--surface); } }
.note-list.anim .tr { animation: fade-up var(--d2) var(--ease) both; }
body.hide-notes .view-desk { grid-template-columns: minmax(0, 1fr) 384px; } body.hide-notes .notes { display: none; }
body.hide-insp .view-desk { grid-template-columns: 268px minmax(0, 1fr); } body.hide-insp .insp { display: none; }
body.hide-notes.hide-insp .view-desk { grid-template-columns: minmax(0, 1fr); }

/* ---------- 窗格与标签页 ---------- */
.panes { display: flex; gap: 8px; min-width: 0; min-height: 0; }
.panes > .pane { flex: 1 1 0; }
.pane { border-radius: var(--r-page); box-shadow: var(--sh1); transition: box-shadow var(--d2) linear; }
.panes.split .pane.focused { box-shadow: 0 0 0 1px var(--fg-3), 0 1px 2px rgba(0, 0, 0, .04); }
.tabbar { flex: none; display: flex; align-items: center; gap: 2px; height: 44px; padding: 6px 10px 0; overflow-x: auto; scrollbar-width: none; }
.tabbar::-webkit-scrollbar { display: none; }
.tab-note { display: flex; align-items: center; gap: 7px; height: 28px; max-width: 200px; min-width: 0; padding: 0 3px 0 10px; border-radius: var(--r-in); color: var(--fg-3); font-size: var(--fs-2); cursor: pointer; flex: none; transition: background-color var(--d1) linear, color var(--d1) linear; }
.tab-note.new { animation: tab-pop var(--d2) var(--ease) both; }
@keyframes tab-pop { from { opacity: 0; transform: scale(.94); } }
.tab-note span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-note.on { background: var(--sunk-2); color: var(--fg); }
.tab-x { display: grid; place-items: center; width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; color: var(--fg-3); flex: none; opacity: 0; transition: opacity var(--d1) linear, background-color var(--d1) linear; }
.tab-note.on .tab-x, .tab-note:focus-within .tab-x { opacity: 1; }
@media (hover: hover) { .tab-note:hover { background: var(--hover); color: var(--fg); } .tab-note.on:hover { background: var(--sunk-2); } .tab-note:hover .tab-x { opacity: 1; } .tab-x:hover { background: var(--sunk-2); color: var(--fg); } }
@media (hover: none) { .tab-x { opacity: 1; } }
.tab-add { flex: none; }
.panes.split .dh-hide { display: none; }
.panes.split .paper { padding-inline: 0; }

/* ---------- 双链、标签 ---------- */
.k-link { color: var(--link); text-decoration: underline 1px color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 4px; }
.k-link.miss { color: var(--fg-2); text-decoration: underline dashed 1px var(--fg-3); }
.k-tag { color: var(--link); background: var(--accent-soft); border-radius: 4px; }
a.wikilink { color: var(--link); text-decoration: underline 1px color-mix(in srgb, var(--link) 40%, transparent); text-underline-offset: 3px; }
a.wikilink.miss { color: var(--fg-2); text-decoration-style: dashed; }
.pv-article .tag, .tag { color: var(--link); background: var(--accent-soft); border-radius: 5px; padding: 0 5px; font-size: .92em; }
.link-suggest { position: fixed; z-index: 70; width: 280px; max-height: 320px; overflow: auto; background: var(--surface); border-radius: 12px; box-shadow: var(--sh2); padding: 4px; animation: pop-in var(--d2) var(--ease); }
.ls-item { display: flex; align-items: baseline; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: var(--fs-2); cursor: pointer; }
.ls-item b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ls-item.on { background: var(--sunk-2); }
.ls-new { display: inline-flex; align-items: center; gap: 6px; color: var(--link); }
.ls-foot { font-size: var(--fs-1); padding: 6px 10px 4px; box-shadow: inset 0 .5px 0 var(--line); margin-top: 4px; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px) scale(.98); } }

/* 链接面板 */
.lk { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--sh1); }
.lk-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.lk-title { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: var(--fg); font-weight: 500; font-size: var(--fs-2); text-align: left; }
.lk-title .ic { color: var(--fg-3); }
@media (hover: hover) { .lk-title:hover { color: var(--link); } }
.lk-line { font-size: var(--fs-1); color: var(--fg-2); line-height: 1.6; padding-left: 10px; box-shadow: inset 2px 0 0 var(--line-2); }
.lk-line mark { background: var(--hl); color: inherit; border-radius: 2px; }
.lk-out { display: flex; flex-wrap: wrap; gap: 6px; }
.chip.miss { box-shadow: none; outline: 1px dashed var(--line-2); outline-offset: -1px; color: var(--fg-2); }

/* ---------- 右键菜单 ---------- */
.ctx-menu { position: fixed; z-index: 90; min-width: 190px; padding: 4px; background: var(--surface); border-radius: 12px; box-shadow: var(--sh2); opacity: 0; transform: scale(.96); transition: opacity .1s linear, transform var(--d2) var(--ease); }
.ctx-menu.in { opacity: 1; transform: none; } .ctx-menu.out { opacity: 0; transition: opacity .1s linear; }
.ctx-item { display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--fg); font-size: var(--fs-2); text-align: left; transition: transform var(--d1) var(--ease); }
.ctx-item .ic { color: var(--fg-3); } .ctx-item.danger, .ctx-item.danger .ic { color: var(--bad); }
.ctx-item:focus-visible { outline: none; background: var(--sunk-2); }
@media (hover: hover) { .ctx-item:hover { background: var(--sunk-2); } .ctx-item:hover .ic { color: var(--fg); } .ctx-item.danger:hover { background: var(--bad-bg); color: var(--bad); } .ctx-item.danger:hover .ic { color: var(--bad); } }
.ctx-sep { height: .5px; margin: 4px 8px; background: var(--line-2); }

/* ---------- 快速切换 / 命令面板（从顶部长出来，同一个卡片） ---------- */
.palette { position: fixed; inset: 0; z-index: 85; display: grid; justify-items: center; align-items: start; padding: 14vh 16px 16px; }
.pal-back { position: absolute; inset: 0; background: rgba(0, 0, 0, .2); opacity: 0; transition: opacity var(--d2) linear; }
.pal-card { position: relative; width: min(600px, 100%); max-height: 64vh; display: flex; flex-direction: column; background: var(--surface); border-radius: 16px; box-shadow: var(--sh2); overflow: hidden; opacity: 0; transform: translateY(-8px) scale(.97); transition: opacity .1s linear, transform var(--d2) var(--ease); }
.palette.in .pal-back { opacity: 1; } .palette.in .pal-card { opacity: 1; transform: none; transition: opacity var(--d1) linear .03s, transform var(--d3) var(--ease); }
.palette.out .pal-back, .palette.out .pal-card { opacity: 0; transition: opacity .12s linear; }
.pal-input { display: flex; align-items: center; gap: 10px; padding: 0 16px; box-shadow: inset 0 -.5px 0 var(--line); color: var(--fg-3); }
.pal-input input { flex: 1; height: 52px; border: 0; background: transparent; font-size: var(--fs-3); color: var(--fg); outline: none; }
.pal-list { overflow: auto; padding: 6px; }
.pal-item { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 6px 10px; border-radius: 10px; cursor: pointer; transition: transform var(--d1) var(--ease); }
.pal-item .ic { color: var(--fg-3); flex: none; }
.pal-title { flex: 1; min-width: 0; font-size: var(--fs-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal-title mark { background: none; color: var(--fg); font-weight: 600; text-decoration: underline 1.5px var(--accent); text-underline-offset: 3px; }
.pal-sub { font-size: var(--fs-1); color: var(--fg-3); white-space: nowrap; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
.pal-kb { font-size: var(--fs-1); color: var(--fg-3); }
.pal-item.on { background: var(--sunk-2); } .pal-item.on .ic { color: var(--fg); }
.pal-empty { padding: 22px; text-align: center; }
.pal-foot { font-size: var(--fs-1); padding: 8px 16px; box-shadow: inset 0 .5px 0 var(--line); color: var(--fg-3); }

/* ---------- 关系图谱 ---------- */
#v-graph > .graph-wrap { max-width: none; }
.graph-wrap { position: relative; padding: 0; height: calc(100vh - var(--top) - 220px); min-height: 420px; overflow: hidden; background: var(--bg); }
#graph-cv { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#graph-cv:active { cursor: grabbing; }
.graph-ctl { position: absolute; top: 12px; right: 12px; width: 260px; display: grid; gap: 12px; padding: 14px; background: color-mix(in srgb, var(--surface) 86%, transparent); border-radius: 14px; box-shadow: var(--sh2); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.graph-ctl .slider-out { min-width: 44px; height: 30px; }
@media (max-width: 759px) { .graph-ctl { position: static; width: auto; margin: 10px; } .graph-wrap { height: auto; } #graph-cv { height: 60vh; } }

/* ---------- Mac App：系统红绿灯放在标题栏左边，标题栏可以拖动窗口 ---------- */
.is-desk .topbar { -webkit-app-region: drag; }
.is-desk .topbar button, .is-desk .topbar a, .is-desk .topbar input { -webkit-app-region: no-drag; }
button.tstat { cursor: pointer; font: inherit; font-size: var(--fs-1); font-weight: 500; transition: background-color var(--d1) linear; }
@media (hover: hover) { button.tstat:hover { background: var(--hover); color: var(--fg); } }
.ai-sec { display: grid; gap: 10px; padding-top: 14px; box-shadow: inset 0 .5px 0 var(--line); }
.ai-test { min-height: 22px; font-size: var(--fs-2); }


/* ================= 墨点：产品的记号 ================= */
.ic .ink { fill: currentColor; stroke: none; transform-box: fill-box; transform-origin: center; transition: fill var(--d2) linear; }
.ic .eye, .ic .trail { transform-box: fill-box; transform-origin: center; }
.rail button.on .ic .ink { fill: var(--primary); animation: ink-pop .5s var(--spring); }
@keyframes ink-pop { 0% { transform: scale(.4); } 60% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes ink-breathe { 50% { transform: scale(.55); opacity: .55; } }
.ink-dot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
.ink-dot.busy { animation: ink-breathe 1.3s ease-in-out infinite; }
.ink-dot.off { background: var(--fg-3); }
.logo-ink { transform-box: fill-box; transform-origin: center; }
.app:has(.jobbar) .logo-ink { animation: ink-breathe 1.3s ease-in-out infinite; }
/* 新批注：荧光笔从左往右划过去 */
.k-anno.k-fresh { background: linear-gradient(var(--hl), var(--hl)) no-repeat 0 0 / 100% 100%; animation: marker .5s var(--ease) both; }
@keyframes marker { from { background-size: 0% 100%; } }

/* ---------- 导航：三组（写作 / AI 的设定 / 参数） ---------- */
.rail { padding: 6px 0 4px; gap: 4px; }
.rail-sep { width: 22px; height: 1px; margin: 8px 0; background: var(--line-2); flex: none; }
.rail-grow { flex: 1; }

/* ---------- 笔记栏 ---------- */
.notes { gap: 12px; padding: 2px 0 6px; }
.newtog { position: relative; isolation: isolate; flex: none; display: grid; grid-template-columns: 1fr 1fr; height: 44px; padding: 3px; border-radius: 999px; background: var(--sunk-2); }
.newtog > button { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 999px; background: transparent; color: var(--fg-2); font-size: var(--fs-2); font-weight: 500; transition: color var(--d2) linear, transform var(--d1) var(--ease); }
.newtog > button:active { transform: scale(.96); }
.newtog > button.on { color: #fff; }
.newtog > .seg-ind { border-radius: 999px; background: var(--primary); box-shadow: 0 1px 2px rgba(0, 111, 238, .3), 0 6px 16px -6px rgba(0, 111, 238, .7); }
.newtog:not(.glide) > button.on { background: var(--primary); }
@media (hover: hover) { .newtog > button:not(.on):hover { color: var(--fg); } }
/* 机器人会眨眼；笔划过时留下一道墨迹 */
.newtog > button[data-act="new-ai"] .eye { animation: blink 4.2s ease-out infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.15); } }
.newtog > button[data-act="new-me"]:hover .trail { stroke-dasharray: 12; animation: trail .7s var(--ease) both; }
@keyframes trail { from { stroke-dashoffset: 12; } }
.notes .search { flex: none; }
.side-h { flex: none; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 2px 0 10px; }
.side-h h2 { font-size: var(--fs-1); font-weight: 500; color: var(--fg-3); }
.side-n { font-size: var(--fs-1); color: var(--fg-3); }
.side-hint { margin-left: auto; padding-right: 6px; font-size: var(--fs-1); color: var(--fg-3); opacity: .8; }
.notes .note-list { padding-top: 0; margin-top: -6px; }
.status-head { margin-top: 2px; }
.status-list { position: relative; isolation: isolate; flex: none; display: grid; gap: 2px; padding: 0 2px; overflow: visible; }
.st-row { --sc: var(--fg-3); position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 12px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--fg-2); font-size: var(--fs-2); text-align: left; transition: color var(--d2) linear, transform var(--d1) var(--ease), background-color var(--d1) linear; }
.st-row.on { color: var(--fg); }
.st-row .sdot { width: 8px; height: 8px; background: var(--sc); transform-box: fill-box; }
.st-row .st-n { margin-left: auto; font-size: var(--fs-1); color: var(--fg-3); }
.st-row[data-id="all"] .sdot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--fg-3); }
.st-row[data-id="idea"] { --sc: #A1A1AA; } .st-row[data-id="draft"] { --sc: #3B82F6; } .st-row[data-id="review"] { --sc: #F59E0B; } .st-row[data-id="done"] { --sc: #22C55E; } .st-row[data-id="published"] { --sc: #14B8A6; }
.status-list > .seg-ind, .status-list:not(.glide) > .st-row.on { background: var(--sunk-2); box-shadow: none; border-radius: var(--r-ctl); }
@media (hover: hover) { .st-row:not(.on):hover { color: var(--fg); } }
.st-row.drop { background: color-mix(in srgb, var(--sc) 14%, transparent); color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--sc); }
.st-row.drop .sdot { transform: scale(1.5); transition: transform var(--d2) var(--spring); }
.st-row.got .sdot { animation: ink-pop .55s var(--spring); }
.tr[draggable="true"] { cursor: grab; } .tr[draggable="true"]:active { cursor: grabbing; }

/* ---------- 右栏：写作流程线（写 → 改 → 评 → 图 → 发 | 链接 版本） ---------- */
.insp-tabs { padding: 0 0 6px; align-items: flex-start; }
.flow-wrap { flex: 1; min-width: 0; display: grid; gap: 4px; }
.flow { --aux: 86px; --fl: 36px; position: relative; isolation: isolate; container-type: inline-size; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) var(--aux); align-items: center; height: 44px; }
.fl { position: relative; z-index: 1; justify-self: center; width: var(--fl); height: var(--fl); display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--fg-3); transition: color var(--d2) linear, transform var(--d1) var(--ease); }
.fl:active { transform: scale(.92); }
.fl.on { color: var(--fg); }
.fl.done .ink, .fl.on .ink { fill: var(--primary); }
.fl.on .ink { animation: ink-pop .5s var(--spring); }
.flow.busy .fl.on .ink { animation: ink-breathe 1.3s ease-in-out infinite; }
@media (hover: hover) { .fl:not(.on):hover { color: var(--fg); } }
/* 两步之间的连线：每一段是前一个按钮的 ::after；做完的部分被墨水填满 */
.flow > .fl:not(:nth-of-type(5))::after { content: ""; position: absolute; z-index: -1; left: calc(100% + 3px); top: 50%; width: calc((100cqw - var(--aux)) / 5 - var(--fl) - 6px); height: 2px; margin-top: -1px; border-radius: 1px; background: linear-gradient(var(--primary), var(--primary)) no-repeat 0 0 / 0% 100%, var(--line-2); }
.flow > .fl.lit::after { background-size: 100% 100%, auto; transition: background-size .45s var(--ease) calc(var(--i, 0) * .12s); }
.flow > .seg-ind { border-radius: 50%; }
.flow-aux { display: flex; justify-content: flex-end; align-items: center; gap: 2px; padding-left: 10px; box-shadow: inset .5px 0 0 var(--line-2); height: 24px; }
.fl.aux { --fl: 34px; }
.fl-badge { position: absolute; top: auto; bottom: -4px; right: -8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface); box-shadow: var(--sh1); color: var(--fg-2); font-size: var(--fs-1); font-weight: 600; line-height: 18px; text-align: center; }
.fl-badge.warn { background: var(--hl-on); color: var(--fg); box-shadow: none; }
.flow-cap { display: flex; align-items: baseline; gap: 8px; min-height: 20px; padding: 0 6px; font-size: var(--fs-1); color: var(--fg-3); }
.flow-cap b { color: var(--fg); font-weight: 600; flex: none; }
.flow-cap span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-cap.swap > * { animation: view-fade .26s linear both; }
.ai-note { display: flex; align-items: center; gap: 8px; font-size: var(--fs-1); color: var(--fg-3); padding: 0 4px; }
.jobbar .ink-dot { background: currentColor; }

/* ---------- 配图（右栏） ---------- */
.il-root { display: flex; flex-direction: column; gap: 14px; }
.il-setup { gap: 12px; }
.il-setrow { display: flex; align-items: center; gap: 10px; }
.il-setrow .il-style-now { flex: 1; box-shadow: none; padding: 0; background: transparent; }
.il-style-now .ic { margin-left: auto; color: var(--fg-3); transition: transform var(--d2) var(--glide); }
.il-style-now[aria-expanded="true"] .ic { transform: rotate(90deg); }
.il-root .sg { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; animation: rise var(--d2) var(--ease); }
.il-root .sg-item { padding: 4px; }
.il-root .sg-name { font-weight: 500; }
.il-list { display: grid; gap: 12px; }
.il-card { display: grid; gap: 12px; padding: 14px; border-radius: var(--r-card); background: var(--surface); box-shadow: var(--sh1); transition: box-shadow var(--d2) linear; }
.il-card.open { box-shadow: 0 0 0 1.5px var(--fg), 0 2px 10px rgba(0, 0, 0, .06); }
.il-card.busy .il-purpose, .il-card.busy .il-scene { opacity: .5; }
.il-row1 { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: start; }
.il-root .il-thumb { max-height: 120px; outline: 0; box-shadow: inset 0 0 0 .5px var(--line); border-radius: var(--r-in); }
.il-ph { color: var(--fg-3); }
.il-root .il-up { left: auto; right: 4px; bottom: 4px; width: 26px; height: 26px; padding: 0; border-radius: 50%; opacity: 0; transition: opacity var(--d1) linear; }
.il-thumb:hover .il-up, .il-thumb:focus-within .il-up, .il-thumb:not(:has(img)) .il-up { opacity: 1; }
.il-info { display: grid; gap: 4px; min-width: 0; }
.il-tags { display: flex; align-items: center; gap: 6px; }
.il-purpose { font-size: var(--fs-2); font-weight: 600; line-height: 1.5; }
.il-scene { font-size: var(--fs-1); color: var(--fg-2); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.il-acts { display: flex; align-items: center; gap: 6px; }
.il-edit { display: grid; gap: 12px; padding-top: 12px; box-shadow: inset 0 .5px 0 var(--line); animation: rise var(--d2) var(--ease); }

  <header class="topbar">
    <div class="top-side" id="top-side">
      <div class="logo" aria-hidden="true" id="logo"></div>
      <button type="button" class="icon-btn top-ic" data-side="files" data-ic="folder" aria-label="笔记" title="笔记（⌘[）"></button>
      <button type="button" class="icon-btn top-ic" data-side="search" data-ic="search" aria-label="搜索" title="搜索全部笔记（⇧⌘F）"></button>
      <span class="grow"></span>
      <button type="button" class="icon-btn top-ic" data-side="toggle" data-ic="sidebar" aria-label="收起侧栏" title="收起 / 展开侧栏（⌘[）"></button>
    </div>
    <nav class="crumb" id="crumb" aria-label="当前位置"></nav>
    <div class="top-status" id="top-status" role="status"></div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail" aria-label="页面">
      <button type="button" data-view="desk" data-ic="write" title="写作：笔记、正文、批注改稿、配图" class="on" aria-label="写作"></button>
      <button type="button" data-view="topics" data-ic="radar" title="选题：联网找最近的热点，改成能写的题" aria-label="选题"></button>
      <button type="button" data-view="graph" data-ic="graph" title="图谱：笔记之间的链接关系" aria-label="图谱"></button>
      <span class="rail-sep" aria-hidden="true"></span>
      <button type="button" data-view="souls" data-ic="soul" title="灵魂：作者人设、说话语气和真实经历" aria-label="灵魂"></button>
      <button type="button" data-view="mind" data-ic="mind" title="心智：写给多大众的读者、用什么锚点" aria-label="心智"></button>
      <button type="button" data-view="nature" data-ic="nature" title="人性：读者想要什么、读时的感受、读完记住什么" aria-label="人性"></button>
      <button type="button" data-view="memory" data-ic="memory" title="记忆：你纠正过的错误，AI 不再犯" aria-label="记忆"></button>
      <span class="rail-grow" aria-hidden="true"></span>
      <button type="button" data-view="settings" data-ic="sliders" title="参数：评分、篇幅、文风限制等数字" aria-label="参数"></button>
    </nav>

    <main class="views" id="main">
      <section class="view view-desk" id="v-desk">
        <aside class="notes" id="notes" aria-label="笔记">
          <button type="button" class="vault-h" id="vault-h" title="写作库">
            <span class="vault-name" id="vault-name">我的笔记</span><span data-ic="chev" class="vault-chev"></span>
          </button>
          <div class="new-rows" id="new-rows">
            <button type="button" class="side-row" data-act="new-me" data-ic="write" title="新建一篇，自己写（⌘N）">新建笔记</button>
            <button type="button" class="side-row" data-act="new-ai" data-ic="ai" title="新建一篇，先让 AI 写初稿（⇧⌘N）">让 AI 写一篇</button>
          </div>
          <div class="search" id="side-search"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="input" id="note-q" type="search" placeholder="搜标题、正文、标签" aria-label="搜索笔记"><button type="button" class="icon-btn sm search-x" data-side="files" aria-label="退出搜索" title="退出搜索（Esc）" data-ic="x"></button></div>
          <div class="side-h"><h2>笔记</h2><span class="side-n" id="notes-count">0</span><span class="grow"></span><button type="button" class="icon-btn sm" data-act="folder-add" aria-label="新建文件夹" title="新建文件夹" data-ic="folderPlus"></button><button type="button" class="icon-btn sm" data-act="tree-collapse" aria-label="全部收起" title="全部收起" data-ic="collapse"></button><button type="button" class="icon-btn sm only-narrow" data-act="close-drawers" aria-label="收起笔记列表" data-ic="x"></button></div>
          <div class="note-list" id="note-list"><div class="empty-small">读取中…</div></div>
          <div class="side-h status-head"><h2>状态</h2><span class="side-hint">把笔记拖到这里改状态</span></div>
          <div class="status-list sfilter" id="status-filter" role="group" aria-label="按状态筛选"></div>
        </aside>

        <div class="panes" id="panes"></div>
        <aside class="insp" id="insp" aria-label="AI 面板">
          <div class="insp-tabs" id="insp-tabs"></div>
          <div class="insp-body" id="insp-body"></div>
        </aside>
      </section>
      <section class="view" id="v-topics" hidden></section>
      <section class="view" id="v-graph" hidden></section>
      <section class="view" id="v-souls" hidden></section>
      <section class="view" id="v-mind" hidden></section>
      <section class="view" id="v-nature" hidden></section>
      <section class="view" id="v-memory" hidden></section>
      <section class="view" id="v-settings" hidden></section>
    </main>
  </div>
</div>

<div class="scrim" id="scrim" aria-hidden="true"></div>

<div class="selbar" id="selbar" hidden>
  <div class="sb-inner">
    <div class="sb-bar" id="sb-quick" role="toolbar" aria-label="批注选中的文字"></div>
    <div class="sb-compose" id="sb-compose">
      <div class="sb-quote" id="sb-quote"></div>
      <div class="chips" id="sb-types" role="group" aria-label="批注类型"></div>
      <textarea class="input sb-note" id="sb-note" rows="3" aria-label="批注内容"></textarea>
      <div class="sb-foot">
        <label class="toggle"><input type="checkbox" class="sw" id="sb-remember"> 记住，以后都别犯</label>
        <div class="sb-actions">
          <button type="button" class="btn sm ghost" data-sb="cancel">取消</button>
          <button type="button" class="btn sm" data-sb="save">保存</button>
          <button type="button" class="btn sm primary" data-sb="now">保存并让 AI 改</button>
        </div>
      </div>
    </div>
  </div>
</div>
